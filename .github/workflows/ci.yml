name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Any Fe release from 26.5.0 on is allowed for the contest. Settlane is
  # developed and verified on 26.6.0 (storage layout differs from 26.5).
  FE_VERSION: v26.6.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      # Workspace layout (D-014): `ingots/settlane` is the production ingot and the only
      # default member; `ingots/settlane-dev` holds test helpers. Verified on Fe 26.6.0:
      # a bare `fe fmt --check` at the workspace root fails with "No .fe files found", while
      # `fe fmt --check ingots` checks both ingots. `fe check`, `fe test` and `fe build` at
      # the root see the default member only, so the dev ingot is checked by path.
      - name: Format check (both ingots)
        run: fe fmt --check ingots
      - run: fe check
      - name: Type-check the dev ingot (not covered by the root `fe check`)
        run: fe check ingots/settlane-dev
      # Run the tests of BOTH ingots explicitly and fail if any ingot ran fewer tests than
      # its floor in scripts/test-policy.json. A bare `fe test` prints "No tests found" and
      # exits 0 for an empty ingot, which is a silent false green.
      - name: Test gate self-test
        run: python3 scripts/check_tests.py --selftest
      - name: Tests for both ingots (fails if none run)
        run: python3 scripts/check_tests.py
      # Production build: only the default member, so test contracts must not appear.
      # `fe build` never clears out/, so start from an empty directory (review M1); the
      # lint also rejects any file in out/ that is not a fresh deployable artifact.
      - name: Clean build output
        run: rm -rf out
      - run: fe build
      # Policy lint (D-012, D-009, D-014). Fe 26.6.0 does not narrow a `recv` arm that
      # lists `call` or `create` read-only, so only payout arms may mention them. Also
      # checks the production clock, the ingot layout, and that `out/` is exactly the
      # deployable allowlist.
      - name: Settlane policy lint self-test
        run: python3 scripts/settlane_lint.py --selftest
      - name: Settlane policy lint (fails the build on a violation)
        run: python3 scripts/settlane_lint.py ingots --abi-dir out
      # Re-runs the Phase 1 compiler experiments against the pinned Fe version.
      # Remove with experiments/ before the final submission.
      - name: Phase 1 compiler experiments
        run: bash experiments/phase1/run.sh
      # Review 2026-11-18 regressions: the repros still reproduce on the pinned Fe, and
      # the lint rejects every one of them (H1-H4, M1).
      - name: Review regressions
        run: bash experiments/review/run.sh

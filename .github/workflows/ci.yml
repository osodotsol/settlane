name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Any Fe release from 26.5.0 on is allowed for the contest. Settlane is
  # developed and verified on 26.6.0 (storage layout differs from 26.5).
  FE_VERSION: v26.6.0
  # SHA-256 of the release asset fe_linux_amd64 of FE_VERSION, as published by GitHub for the
  # argotorg/fe v26.6.0 release and equal to the locally verified binary (audit R-1, D-029).
  # The step below downloads that exact asset and installs nothing on a mismatch. Change both
  # values together.
  FE_SHA256: 697081cb9265bd1be7a5d33e6bb0c8559ee5ff542abab9a046540fc151b4edaa

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned install (audit R-1): the release asset itself, checked against FE_SHA256, instead of
      # running the unpinned installer script from the `master` branch. The step still begins with
      # `curl`, so scripts/ci_negative_controls.py skips it exactly as before.
      - name: Install Fe (pinned, SHA-256 verified)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/fe" "https://github.com/argotorg/fe/releases/download/${FE_VERSION}/fe_linux_amd64"
          echo "${FE_SHA256}  $RUNNER_TEMP/fe" | sha256sum -c -
          install -D -m 0755 "$RUNNER_TEMP/fe" "$HOME/.fe/bin/fe"
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      # Workspace layout (D-014): `ingots/settlane` is the production ingot and the only
      # default member; `ingots/settlane-dev` holds test helpers. Verified on Fe 26.6.0:
      # a bare `fe fmt --check` at the workspace root fails with "No .fe files found", while
      # `fe fmt --check ingots` checks both ingots. `fe check`, `fe test` and `fe build` at
      # the root see the default member only, so the dev ingot is checked by path.
      - name: Format check (both ingots)
        run: fe fmt --check ingots
      - run: fe check
      - name: Type-check the dev ingot (not covered by the root `fe check`)
        run: fe check ingots/settlane-dev
      # Run the tests of BOTH ingots explicitly and fail if any ingot ran fewer tests than
      # its floor in scripts/test-policy.json. A bare `fe test` prints "No tests found" and
      # exits 0 for an empty ingot, which is a silent false green.
      - name: Test gate self-test
        run: python3 scripts/check_tests.py --selftest
      - name: Tests for both ingots (fails if none run)
        run: python3 scripts/check_tests.py
      # Fe test code cannot read emitted events, but `fe test --show-logs` prints them. This
      # decodes every AgreementCreated (topics and payload) with an independent Keccak/ABI
      # encoder and checks the exact sequences the tests produce (R-002 finding 4).
      - name: Event checker self-test
        run: python3 scripts/keccak.py && python3 scripts/check_events.py --selftest
      - name: Events of both ingots (topics and payload)
        run: python3 scripts/check_events.py
      # Production build: only the default member, so test contracts must not appear.
      # `fe build` never clears out/, so start from an empty directory (review M1); the
      # lint also rejects any file in out/ that is not a fresh deployable artifact.
      - name: Clean build output
        run: rm -rf out
      - run: fe build
      # Policy lint (D-012, D-009, D-014). Fe 26.6.0 does not narrow a `recv` arm that
      # lists `call` or `create` read-only, so only payout arms may mention them. Also
      # checks the production clock, the ingot layout, and that `out/` is exactly the
      # deployable allowlist.
      - name: Settlane policy lint self-test
        run: python3 scripts/settlane_lint.py --selftest
      - name: Settlane policy lint (fails the build on a violation)
        run: python3 scripts/settlane_lint.py ingots --abi-dir out
      # Re-runs the Phase 1 compiler experiments against the pinned Fe version.
      # Remove with experiments/ before the final submission.
      - name: Phase 1 compiler experiments
        run: bash experiments/phase1/run.sh
      # Review 2026-11-18 regressions: the repros still reproduce on the pinned Fe, and
      # the lint rejects every one of them (H1-H4, M1).
      - name: Review regressions
        run: bash experiments/review/run.sh

  # Production bytecode on a local Anvil with fixed block timestamps (Phase 4B, D-026, D-027).
  # No Fe test can reach a deadline on the production contract (the Fe test block never advances),
  # so a wrong production clock in Submit, Approve, Reject or Refund passes every step of the
  # `test` job and is seen only by the lint rule C-CLOCK. This job deploys the real Settlane.bin to
  # a throw-away Anvil on 127.0.0.1 (simulated ETH, no network, no key) and crosses every deadline.
  # Foundry is pinned: the installer checks a SHA-256 stored in this repository and installs
  # nothing on a mismatch. The `test` job above is unchanged.
  anvil:
    name: anvil (production bytecode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Pinned install (audit R-1): the release asset itself, checked against FE_SHA256, instead of
      # running the unpinned installer script from the `master` branch. The step still begins with
      # `curl`, so scripts/ci_negative_controls.py skips it exactly as before.
      - name: Install Fe (pinned, SHA-256 verified)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/fe" "https://github.com/argotorg/fe/releases/download/${FE_VERSION}/fe_linux_amd64"
          echo "${FE_SHA256}  $RUNNER_TEMP/fe" | sha256sum -c -
          install -D -m 0755 "$RUNNER_TEMP/fe" "$HOME/.fe/bin/fe"
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - name: Install Foundry v1.10.0 (anvil and cast; pinned, SHA-256 verified)
        run: |
          bash experiments/anvil/install_foundry.sh
          echo "$HOME/tools/foundry/bin" >> "$GITHUB_PATH"
      - name: Anvil suite (52 checks on the production bytecode)
        run: python3 experiments/anvil/run.py
      - name: Anvil wrong-clock mutations (8 rebuilt contracts, each must fail only its own arm)
        run: python3 experiments/anvil/run.py --mutations

  # Frontend (D-030): a separate job, so the Fe `test` job, the `anvil` job, the negative-control runner
  # (which reads only `test`) and `release-gate` are unchanged. It rebuilds the production ABI with the
  # pinned Fe and fails if the frontend's generated ABI differs from it or from the lint's ABI lock.
  frontend:
    name: frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe (pinned, SHA-256 verified)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/fe" "https://github.com/argotorg/fe/releases/download/${FE_VERSION}/fe_linux_amd64"
          echo "${FE_SHA256}  $RUNNER_TEMP/fe" | sha256sum -c -
          install -D -m 0755 "$RUNNER_TEMP/fe" "$HOME/.fe/bin/fe"
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - name: Build the production ABI (fe build)
        run: rm -rf out && fe build
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile only)
        working-directory: frontend
        run: npm ci
      - name: ABI equals the production build and the lock
        working-directory: frontend
        run: npm run check-abi
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Snapshot integrity (offline, deterministic; the independent archival check needs the network and is run by an operator)
        working-directory: frontend
        run: npm run snapshot:verify-local
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Production build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # The one check to require before a release or a merge: it passes only when BOTH jobs passed
  # (a skipped, cancelled or failed job fails it). Branch protection itself is a repository
  # setting that a workflow file cannot create; see experiments/anvil/README.md.
  release-gate:
    name: release-gate (test and anvil)
    needs: [test, anvil]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Both jobs must have succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          ANVIL_RESULT: ${{ needs.anvil.result }}
        run: |
          echo "test: $TEST_RESULT"
          echo "anvil: $ANVIL_RESULT"
          test "$TEST_RESULT" = "success" && test "$ANVIL_RESULT" = "success"
